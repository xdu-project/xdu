name: Release

on:
  release:
    types: [published]
  # Manual trigger for re-running a failed release against an existing tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to (re)build and publish (e.g., v0.4.1)'
        required: true
  # Build-and-check only: every leg builds, fetches its DuckDB extensions and proves they load
  # from the assembled tarball, so a change that would break a release fails on the pull
  # request instead. Nothing is published, and no job on this path holds a write scope or
  # reads a secret. The paths are every input that decides whether a tarball's extensions load,
  # and the trust source's code, so check.sh's AWS TLS probe re-runs on every release platform
  # when it changes.
  pull_request:
    paths:
      - .github/workflows/release.yaml
      - packaging/extensions/**
      - examples/**
      - src/engine.rs
      - src/s3.rs
      - src/lib.rs
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml

# Least privilege at the top; the publish job elevates to contents: write for the upload, and
# it never runs on a pull request.
permissions:
  contents: read

# Never cancel an in-flight release: a half-published set of assets is worse than a queued run.
# A pull-request run publishes nothing, so a newer push supersedes it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The tag being released: the release tag on `release: published`, or the manual input on
  # `workflow_dispatch`. Every job derives names and checkout refs from this one value. A
  # pull request has no tag, so it names its artifacts pr<number>, which keeps them slash-free.
  TAG: ${{ github.event_name == 'pull_request' && format('pr{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  # Build the host-independent artifacts (man pages + completions) exactly once and hand them
  # to every build-matrix leg via an artifact, so all tarballs ship an identical share/ tree.
  prepare:
    name: Prepare (man pages + completions)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.pull_request.head.sha || github.ref }}

      - name: Resolve toolchain from rust-toolchain.toml
        id: rust
        run: |
          echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # SHA-pinned action; toolchain version comes from rust-toolchain.toml (single source)
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install scdoc
        run: sudo apt-get update && sudo apt-get install -y scdoc

      - name: Render man pages (doc/*.scd -> share/man/man1/*.1)
        run: |
          mkdir -p share/man/man1
          for scd in doc/*.scd; do
            name=$(basename "$scd" .1.scd)
            scdoc < "$scd" > "share/man/man1/${name}.1"
          done

      - name: Generate shell completions
        run: |
          cargo build --release --locked --bin gen-completions
          mkdir -p share/bash-completion/completions share/zsh/site-functions
          ./target/release/gen-completions share/bash-completion/completions share/zsh/site-functions

      - name: Upload share artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: share
          path: share/
          if-no-files-found: error

  # Build one Linux gnu release tarball per target, compiled inside manylinux_2_28
  # containers so the binaries carry a glibc 2.28 floor (RHEL8+) instead of the host
  # runner's. Each leg uploads its tarball as a *workflow* artifact — nothing is attached
  # to the GitHub release here, so a single failing leg cannot leave a partial asset set
  # on the release page. (`container:` cannot be conditional per matrix leg, so the Apple
  # legs live in a separate `build-macos` job below; `publish` needs both.)
  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64:latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64:latest
    # The C++ runtime stays dynamically linked. A static link was tried and measured to
    # leave NEEDED libstdc++/libgcc_s in place even through direct rustc invocation, while
    # measured usage needs at most GLIBCXX_3.4.22 against RHEL8 stock 3.4.25 — so static
    # linking buys nothing here. The floor step below asserts the version ceilings instead
    # of assuming them.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # CRITICAL: on a manual re-run build from the tag being released, not the default
          # branch — otherwise the tarball contents drift from what the tag points at. On a
          # pull request, build the branch head itself rather than the synthetic merge commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.pull_request.head.sha || github.ref }}

      # dtolnay/rust-toolchain cannot run inside a container job, so rustup installs
      # directly: no default toolchain, letting rust-toolchain.toml (the single source)
      # select and auto-install the pinned channel on first cargo run.
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # No cargo cache in these legs: the registry path does not map across the container
      # boundary, and a warm cache is not worth a poisoning vector on the publish path. The
      # timeout covers a cold bundled-DuckDB compile.

      # One invocation, so the extension probe and the tarball binaries share every compiled
      # artifact, the bundled DuckDB engine above all.
      - name: Build release binaries and the extension probe
        run: cargo build --release --locked --target ${{ matrix.target }} --bins --example extension-probe

      # Fail the leg when the runtime floor floats: the maximum GLIBC_* version node
      # across the six binaries must not exceed 2.28, GLIBCXX_* must not exceed RHEL8
      # stock 3.4.25, and GCC_* must not exceed 8.0.0 (libgcc-8.5.0, measured on ubi8).
      # An empty GLIBC maximum fails rather than passing vacuously; absent C++ families
      # (pure-Rust xdu needs none) pass. A final allowlist catches any surprise new .so
      # beyond libc/libm/libdl/libpthread/libgcc_s/libstdc++. Runs before assembly so a
      # breach never reaches a tarball.
      - name: Assert glibc floor
        run: |
          set -eu
          fail=0
          for bin in xdu xdu-find xdu-view xdu-rm xdu-cp xdu-mv; do
            f="target/${{ matrix.target }}/release/$bin"
            max=$(objdump -T "$f" | grep -o 'GLIBC_[0-9][0-9.]*' | sort -Vu | tail -n 1)
            if [ -z "$max" ]; then
              echo "no GLIBC version nodes in $f" >&2; fail=1; continue
            fi
            echo "$bin needs max $max"
            if [ "$(printf '%s\n%s\n' "$max" 'GLIBC_2.28' | sort -Vu | tail -n 1)" != 'GLIBC_2.28' ]; then
              echo "floor breach: $bin needs $max" >&2; fail=1
            fi
            for fam in 'GLIBCXX 3.4.25' 'GCC 8.0.0'; do
              famname=${fam%% *}; ceiling=${fam##* }
              need=$(objdump -T "$f" | grep -o "${famname}_[0-9][0-9.]*" | sort -Vu | tail -n 1)
              if [ -n "$need" ] && [ "$(printf '%s\n%s\n' "$need" "${famname}_${ceiling}" | sort -Vu | tail -n 1)" != "${famname}_${ceiling}" ]; then
                echo "runtime breach: $bin needs $need" >&2; fail=1
              fi
            done
            bad=$(objdump -p "$f" | grep 'NEEDED' | awk '{print $2}' | grep -v -e '^libc\.so' -e '^libm\.so' -e '^libdl\.so' -e '^libpthread\.so' -e '^libgcc_s\.so' -e '^libstdc++\.so' -e '^ld-linux' || true)
            if [ -n "$bad" ]; then
              echo "unexpected dynamic needs in $bin: $bad" >&2; fail=1
            fi
          done
          [ "$fail" -eq 0 ]

      # The probe reports the engine version, platform and pinned extension set this build
      # carries, so the leg can only fetch extensions for the engine it is about to ship.
      - name: Fetch DuckDB extensions
        run: sh packaging/extensions/fetch.sh target/${{ matrix.target }}/release/examples/extension-probe staging/lib/xdu/extensions

      - name: Download share artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: share
          path: staging/share

      - name: Assemble release tarball
        run: |
          set -eu
          STAGING="staging"
          mkdir -p "${STAGING}/bin"
          for bin in xdu xdu-find xdu-view xdu-rm xdu-cp xdu-mv; do
            cp "target/${{ matrix.target }}/release/${bin}" "${STAGING}/bin/"
          done
          tar czvf "xdu-${TAG}-${{ matrix.target }}.tar.gz" -C "${STAGING}" bin share lib

      # Extract the exact tarball the next step uploads and load every shipped extension from
      # it under an empty HOME with autoinstall off. A failing leg uploads nothing, and publish
      # needs every leg. The step's last log line is
      # `extension-check: ok platform=<platform> engine=<engine>`.
      - name: Check extensions load (cold HOME)
        run: sh packaging/extensions/check.sh "xdu-${TAG}-${{ matrix.target }}.tar.gz" target/${{ matrix.target }}/release/examples/extension-probe

      - name: Upload tarball artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.target }}
          path: xdu-${{ env.TAG }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # The Apple legs keep the pre-manylinux mechanics: they cannot run in a Linux
  # container, so they build on the macOS runners exactly as before.
  build-macos:
    name: Build macOS (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for each architecture, so the check step runs without Rosetta.
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # CRITICAL: on a manual re-run build from the tag being released, not the default
          # branch — otherwise the tarball contents drift from what the tag points at. On a
          # pull request, build the branch head itself rather than the synthetic merge commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.pull_request.head.sha || github.ref }}

      - name: Resolve toolchain from rust-toolchain.toml
        id: rust
        run: |
          echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # SHA-pinned action; toolchain version comes from rust-toolchain.toml (single source)
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      # One invocation, so the extension probe and the tarball binaries share every compiled
      # artifact, the bundled DuckDB engine above all.
      - name: Build release binaries and the extension probe
        run: cargo build --release --locked --target ${{ matrix.target }} --bins --example extension-probe

      - name: Fetch DuckDB extensions
        run: sh packaging/extensions/fetch.sh target/${{ matrix.target }}/release/examples/extension-probe staging/lib/xdu/extensions

      - name: Download share artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: share
          path: staging/share

      - name: Assemble release tarball
        run: |
          set -eu
          STAGING="staging"
          mkdir -p "${STAGING}/bin"
          for bin in xdu xdu-find xdu-view xdu-rm xdu-cp xdu-mv; do
            cp "target/${{ matrix.target }}/release/${bin}" "${STAGING}/bin/"
          done
          tar czvf "xdu-${TAG}-${{ matrix.target }}.tar.gz" -C "${STAGING}" bin share lib

      # Extract the exact tarball the next step uploads and load every shipped extension from
      # it under an empty HOME with autoinstall off. A failing leg uploads nothing, and publish
      # needs every leg. The step's last log line is
      # `extension-check: ok platform=<platform> engine=<engine>`.
      - name: Check extensions load (cold HOME)
        run: sh packaging/extensions/check.sh "xdu-${TAG}-${{ matrix.target }}.tar.gz" target/${{ matrix.target }}/release/examples/extension-probe

      - name: Upload tarball artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.target }}
          path: xdu-${{ env.TAG }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Attach everything in a single release edit: all tarballs + one SHA256SUMS, after asserting
  # Cargo.toml matches the tag. One gh-release call fixes the 4-way upload race the old
  # per-leg upload had.
  publish:
    name: Publish release assets
    needs: [build, build-macos]
    # A pull request proves the legs build and check; it never publishes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write        # create/update the release and upload assets
      id-token: write         # OIDC token for build-provenance attestation
      attestations: write     # write the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Download all tarball artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: tarball-*
          merge-multiple: true

      - name: Assert Cargo.toml version matches the tag
        run: |
          set -eu
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag_version="${TAG#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "Version mismatch: Cargo.toml=${cargo_version} tag=${TAG} (stripped=${tag_version})" >&2
            exit 1
          fi
          echo "OK: Cargo.toml version ${cargo_version} matches tag ${TAG}"

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -eu
          sha256sum xdu-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/xdu-*.tar.gz'

      - name: Publish release assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/xdu-*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
